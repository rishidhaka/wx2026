name: Sync World Cup Data

# Calls the syncNow Cloud Function every 5 minutes.
# The function handles smart-skipping (only hits the API during active match
# windows) and writes results directly to Firestore.
# The browser picks up changes instantly via onSnapshot — no redeploy needed.

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger data sync
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $FOOTBALLDATA_KEY" \
            https://us-central1-world-cup-2026-e1a0b.cloudfunctions.net/syncNow)
          echo "HTTP $STATUS — $(cat /tmp/resp.json)"
          # Exit 0 even if function is temporarily unavailable
          exit 0
