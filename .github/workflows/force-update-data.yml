name: Force Update World Cup Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'rishidhaka/wx2026'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Force fetch World Cup data (bypasses game-window gate)
        env:
          WC26_API_TOKEN: ${{ secrets.WC26_API_TOKEN }}
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WORLD_CUP_2026_E1A0B }}
          FORCE_FETCH: 'true'
        run: node scripts/fetch-data.js

      - name: Commit and push if data changed
        run: |
          git diff --exit-code data/wc2026.json && echo "No changes" && exit 0
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/wc2026.json
          git commit -m "Force update World Cup data [manual]"
          git push
